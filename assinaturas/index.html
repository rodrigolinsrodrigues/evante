</main>
<script>
  function copiarComSelecao(conteudo) {
    var caixa = document.createElement('div');
    caixa.contentEditable = 'true';
    caixa.style.position = 'fixed';
    caixa.style.left = '-9999px';
    caixa.innerHTML = conteudo;
    document.body.appendChild(caixa);
    var faixa = document.createRange();
    faixa.selectNodeContents(caixa);
    var selecao = window.getSelection();
    selecao.removeAllRanges();
    selecao.addRange(faixa);
    var ok = document.execCommand('copy');
    selecao.removeAllRanges();
    caixa.remove();
    return ok;
  }
  document.querySelectorAll('button[data-copia]').forEach(function (botao) {
    botao.addEventListener('click', function () {
      var conteudo = botao.getAttribute('data-copia');
      var status = botao.parentNode.querySelector('.status');
      var ok = copiarComSelecao(conteudo);
      status.textContent = ok ? 'Copiada! Agora cole no Gmail.' : 'Não foi possível copiar. Tente novamente.';
    });
  });
</script>
